<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Client Site Monitor</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    color: #1a1a1a;
    padding: 30px 20px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }
  h1 { font-size: 22px; margin: 0; }
  .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
  .sheet-link {
    font-size: 13px;
    color: #2563eb;
    text-decoration: none;
    border: 1px solid #dbeafe;
    background: #eff6ff;
    padding: 6px 12px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .sheet-link:hover { background: #dbeafe; }

  .summary { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .summary-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 110px;
  }
  .summary-card .num { font-size: 22px; font-weight: 700; }
  .summary-card .label { font-size: 12px; color: #6b7280; }
  .summary-card.down .num { color: #dc2626; }
  .summary-card.up .num { color: #16a34a; }
  .summary-card.warn .num { color: #d97706; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
  }
  thead th {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 2px solid #e5e7eb;
    color: #6b7280;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    background: #fafafa;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid #f1f2f4; vertical-align: middle; }
  tbody tr:hover { background: #fafafa; }
  a.site-link { color: #1a1a1a; text-decoration: none; font-weight: 600; }
  a.site-link:hover { text-decoration: underline; }
  .url-sub { display: block; color: #9ca3af; font-size: 11px; font-weight: 400; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .pill.up { background: #dcfce7; color: #15803d; }
  .pill.up .dot { background: #22c55e; }
  .pill.down { background: #fee2e2; color: #b91c1c; }
  .pill.down .dot { background: #ef4444; }

  .days-left { font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .days-ok { color: #15803d; }
  .days-warn { background: #fef3c7; color: #b45309; }
  .days-critical { background: #fee2e2; color: #b91c1c; }
  .days-unknown { color: #9ca3af; font-size: 11px; }

  .state { text-align: center; padding: 60px 20px; color: #6b7280; }
  .state.error { color: #b91c1c; }
  footer { margin-top: 16px; font-size: 11px; color: #9ca3af; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-row">
    <div>
      <h1>Client Site Monitor</h1>
      <div class="subtitle">Uptime, SSL &amp; domain expiry across all monitored client sites</div>
    </div>
    <!-- Replace SHEET_URL_HERE with the Google Sheet's share link -->
    <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1kGXRxCouDyVG_I_FNn0ERpTnsoxgKSjKfdUoDQ6i_ns/edit" target="_blank" rel="noopener">Edit monitor list / recipients &rarr;</a>
  </div>

  <div id="summary" class="summary"></div>
  <div id="content"><div class="state" id="loading">Loading status data&hellip;</div></div>
  <footer id="footer"></footer>

</div>

<script>
// Replace with your deployed Worker URL, e.g. https://client-site-monitor-worker.<your-subdomain>.workers.dev
const WORKER_URL = "https://client-site-monitor-worker.john-7d8.workers.dev";
const REFRESH_INTERVAL_MS = 90 * 1000; // auto-refresh every 90 seconds

function daysClass(days) {
  if (days === "" || days === undefined || isNaN(parseInt(days))) return "days-unknown";
  const d = parseInt(days);
  if (d <= 7) return "days-critical";
  if (d <= 30) return "days-warn";
  return "days-ok";
}
function daysLabel(days) {
  if (days === "" || days === undefined || isNaN(parseInt(days))) return "—";
  return parseInt(days) + "d";
}

function render(rows) {
  const loading = document.getElementById("loading");
  if (loading) loading.remove();

  const downCount = rows.filter(r => r["Status"] === "DOWN").length;
  const upCount = rows.filter(r => r["Status"] === "UP").length;
  const expiringCount = rows.filter(r => {
    const s = parseInt(r["SSL Days Left"]);
    const d = parseInt(r["Domain Days Left"]);
    return (!isNaN(s) && s <= 30) || (!isNaN(d) && d <= 30);
  }).length;

  document.getElementById("summary").innerHTML = `
    <div class="summary-card up"><div class="num">${upCount}</div><div class="label">Up</div></div>
    <div class="summary-card down"><div class="num">${downCount}</div><div class="label">Down</div></div>
    <div class="summary-card warn"><div class="num">${expiringCount}</div><div class="label">Expiring &le; 30d</div></div>
    <div class="summary-card"><div class="num">${rows.length}</div><div class="label">Total monitored</div></div>
  `;

  const sorted = [...rows].sort((a, b) => {
    if (a["Status"] !== b["Status"]) return a["Status"] === "DOWN" ? -1 : 1;
    return (a["Name"] || "").localeCompare(b["Name"] || "");
  });

  const bodyRows = sorted.map(r => {
    const status = r["Status"] === "DOWN" ? "down" : "up";
    const sslClass = daysClass(r["SSL Days Left"]);
    const domClass = daysClass(r["Domain Days Left"]);
    return `
      <tr>
        <td>
          <a class="site-link" href="${r['URL']}" target="_blank" rel="noopener">${r["Name"]}</a>
          <span class="url-sub">${r["URL"]}</span>
        </td>
        <td><span class="pill ${status}"><span class="dot"></span>${r["Status"] || "—"}</span></td>
        <td>${r["Last Checked (UTC)"] || "—"}</td>
        <td><span class="days-left ${sslClass}">${daysLabel(r["SSL Days Left"])}</span>
            ${r["SSL Expiry Date"] && r["SSL Expiry Date"] !== "ERROR" ? `<span class="url-sub">${r["SSL Expiry Date"]}</span>` : ""}</td>
        <td><span class="days-left ${domClass}">${daysLabel(r["Domain Days Left"])}</span>
            ${r["Domain Expiry Date"] && !["ERROR","UNKNOWN"].includes(r["Domain Expiry Date"]) ? `<span class="url-sub">${r["Domain Expiry Date"]}</span>` : ""}</td>
      </tr>
    `;
  }).join("");

  document.getElementById("content").innerHTML = `
    <table>
      <thead>
        <tr><th>Site</th><th>Status</th><th>Last Checked (UTC)</th><th>SSL Expiry</th><th>Domain Expiry</th></tr>
      </thead>
      <tbody>${bodyRows}</tbody>
    </table>
  `;

  document.getElementById("footer").textContent =
    "Auto-refreshes every " + (REFRESH_INTERVAL_MS / 1000) + "s. Underlying checks run every 30 minutes.";
}

function renderError(message) {
  document.getElementById("content").innerHTML =
    `<div class="state error">Couldn't load status data.<br>${message}</div>`;
}

async function load() {
  try {
    const res = await fetch(WORKER_URL);
    const data = await res.json();
    if (data.error) { renderError(data.error); return; }
    if (!data.rows || data.rows.length === 0) { renderError("No rows returned."); return; }
    render(data.rows);
  } catch (e) {
    renderError(e.message || String(e));
  }
}

load();
setInterval(load, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
