<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Client Site Monitor</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --up: #22c55e;
    --up-text: #16a34a;
    --down: #ef4444;
    --down-text: #dc2626;
    --warn-bg: #fef3c7;
    --warn-text: #b45309;
    --critical-bg: #fee2e2;
    --critical-text: #b91c1c;
    --row-hover: #fafafa;
    --tab-active-bg: #1a1a1a;
    --tab-active-text: #ffffff;
    --tick-empty: #e5e7eb;
  }
  [data-theme="dark"] {
    --bg: #0f1115;
    --card-bg: #191b20;
    --border: #2a2d34;
    --text: #e6e7eb;
    --text-muted: #9ca3af;
    --text-faint: #6b7280;
    --up: #22c55e;
    --up-text: #4ade80;
    --down: #ef4444;
    --down-text: #f87171;
    --warn-bg: #3f2d0a;
    --warn-text: #fbbf24;
    --critical-bg: #3f1414;
    --critical-text: #fca5a5;
    --row-hover: #20232a;
    --tab-active-bg: #e6e7eb;
    --tab-active-text: #0f1115;
    --tick-empty: #2a2d34;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 30px 20px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }
  h1 { font-size: 22px; margin: 0; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }

  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-pill {
    font-size: 13px;
    color: #2563eb;
    text-decoration: none;
    border: 1px solid #93c5fd;
    background: transparent;
    padding: 6px 12px;
    border-radius: 8px;
    white-space: nowrap;
    cursor: pointer;
    font-family: inherit;
  }
  [data-theme="dark"] .btn-pill { color: #93c5fd; border-color: #3b5480; }
  .btn-pill:hover { background: rgba(37, 99, 235, 0.08); }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active {
    background: var(--tab-active-bg);
    color: var(--tab-active-text);
    border-color: var(--tab-active-bg);
  }

  .summary-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .summary-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 130px;
    flex: 1;
  }
  .summary-card .num { font-size: 20px; font-weight: 700; }
  .summary-card .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .summary-card.good .num { color: var(--up-text); }
  .summary-card.bad .num { color: var(--down-text); }

  .expiring-panel {
    background: var(--card-bg);
    border: 1px solid var(--critical-text);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 12px;
  }
  .expiring-panel .panel-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--critical-text);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .expiring-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 4px 0;
  }
  .expiring-item + .expiring-item { border-top: 1px solid var(--border); }
  .expiring-item .name { font-weight: 600; }
  .expiring-item .detail { color: var(--text-muted); font-size: 12px; }
  .expiring-item .days { font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .expiring-item .days.expiry-warn { background: var(--warn-bg); color: var(--warn-text); }
  .expiring-item .days.expiry-critical { background: var(--critical-bg); color: var(--critical-text); }

  .count-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    flex-wrap: wrap;
  }
  .count-bar b { font-size: 15px; }
  .count-item { display: flex; align-items: center; gap: 6px; }
  .count-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .count-dot.up { background: var(--up); }
  .count-dot.down { background: var(--down); }
  .count-dot.warn { background: #f59e0b; }
  .count-dot.stale { background: var(--text-faint); }

  .list {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  /* Row is a 3-equal-column grid -- the SAME 1fr/1fr/1fr + 12px-gap split as
     .summary-row above, with no extra outer padding on .row itself (that's
     what lets the grid track math match exactly). That's what makes column
     2 (the bar) line up under the middle "Incidents (24h)" summary card:
     both containers are the same total width and split into thirds the
     same way, so their column boundaries land at the same x position. */
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 12px;
    align-items: start;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--row-hover); }

  /* Column 1: icon + name, packed together in their own flex row so they
     don't add a 4th grid column -- the 18px left padding here replaces the
     old .row left padding, giving the same visual inset without changing
     the grid track widths. */
  .row-left { display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding-left: 18px; }

  .status-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    color: #fff;
    font-weight: 700;
    margin-top: 4px; /* nudge down to line up with the name text's first line */
  }
  .status-icon.up { background: var(--up); }
  .status-icon.down { background: var(--down); }
  .status-icon.blocked { background: #f59e0b; }
  .status-icon.stale { background: var(--text-faint); }

  .row-main { flex: 1; min-width: 0; }
  .row-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    display: block;
  }
  .row-name:hover { text-decoration: underline; }
  .row-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
  }
  .type-tag {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    letter-spacing: 0.02em;
  }
  .checked-ago { font-size: 12px; color: var(--text-faint); }

  /* History bar: column 2 of the row's 3-column grid, same width as the
     "Incidents (24h)" summary card above. bar-inner fills it at 100% (no
     fixed px width anymore -- the grid column width already matches).
     48-column grid spans a real 24h window (see BAR_BUCKET_COUNT below);
     each tick is a thin, centered mark within its column (not stretched
     edge-to-edge) so the bar reads as slim ticks. Marker ticks (24h/18h/
     12h/6h/now) are taller so the eye can line them up with their label. */
  .row-bar { min-width: 0; }
  .bar-inner { width: 100%; }
  .mini-bar { display: grid; grid-template-columns: repeat(48, 1fr); align-items: end; height: 22px; margin-top: 8px; }
  .mini-bar .tick { width: 1.5px; justify-self: center; height: 100%; border-radius: 1px; background: var(--tick-empty); }
  .mini-bar .tick.marker { height: 130%; }
  .bar-labels { display: grid; grid-template-columns: repeat(48, 1fr); margin-top: 3px; font-size: 9px; color: var(--text-faint); }

  /* Column 3: stat boxes, same width as column 1 and 2 (equal grid thirds) --
     right-padded to match the left-padding on column 1. */
  .row-right { text-align: right; min-width: 0; padding-right: 18px; }
  .status-label { font-size: 13px; font-weight: 700; }
  .status-label.up { color: var(--up-text); }
  .status-label.down { color: var(--down-text); }
  .status-label.blocked { color: var(--warn-text); }
  .status-label.stale { color: var(--text-muted); }
  /* Reason from the latest check (e.g. "HTTP 403"), shown under the label. */
  .status-detail { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  /* Per-row stat boxes: Uptime/Down, SSL, Domain -- replaces the old
     inline status-label/uptime-pct/expiry-tags text stack with clearer,
     scannable tiles matching the top summary cards' visual language. */
  .stat-boxes { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px 14px; text-align: center; min-width: 72px; }
  .stat-box .stat-num { font-size: 13px; font-weight: 700; }
  .stat-box .stat-num.expiry-warn { color: var(--warn-text); }
  .stat-box .stat-num.expiry-critical { color: var(--critical-text); }
  .stat-box .stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; margin-top: 1px; }

  .uptime-pct { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .expiry-tags { display: flex; gap: 6px; margin-top: 4px; justify-content: flex-end; }
  .expiry-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .expiry-ok { color: var(--text-faint); }
  .expiry-warn { background: var(--warn-bg); color: var(--warn-text); }
  .expiry-critical { background: var(--critical-bg); color: var(--critical-text); }

  .incident-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .incident-row:last-child { border-bottom: none; }
  .incident-icon {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: #fff; font-weight: 700; font-size: 13px;
  }
  .incident-icon.ongoing { background: var(--down); }
  .incident-icon.resolved { background: var(--text-faint); }
  .incident-main { flex: 1; min-width: 0; }
  .incident-name { font-weight: 600; font-size: 14px; }
  .incident-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .incident-badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    flex-shrink: 0;
  }
  .incident-badge.ongoing { background: var(--critical-bg); color: var(--critical-text); }
  .incident-badge.resolved { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

  .state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .state.error { color: var(--down-text); }
  /* Shown when a refresh fails but we still have the last good data on screen. */
  .refresh-note { margin-top: 10px; font-size: 12px; color: var(--warn-text); text-align: center; }
  .refresh-note:empty { display: none; }
  footer { margin-top: 14px; font-size: 11px; color: var(--text-faint); text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-row">
    <div>
      <h1>Client Site Monitor</h1>
      <div class="subtitle">Uptime, SSL &amp; domain expiry across all monitored client sites</div>
    </div>
    <div class="top-actions">
      <button class="btn-pill" id="theme-toggle">Dark mode</button>
      <a class="btn-pill" href="https://docs.google.com/spreadsheets/d/1kGXRxCouDyVG_I_FNn0ERpTnsoxgKSjKfdUoDQ6i_ns/edit" target="_blank" rel="noopener">Edit monitor list / recipients &rarr;</a>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-monitors">Monitors</button>
    <button class="tab-btn" id="tab-incidents">Incidents</button>
  </div>

  <div id="view-monitors">
    <div id="summary24h" class="summary-row"></div>
    <div id="expiring-panel"></div>
    <div id="countbar" class="count-bar"></div>
    <div id="content"><div class="state" id="loading">Loading status data&hellip;</div></div>
  </div>

  <div id="view-incidents" style="display:none;">
    <div id="incidents-content"><div class="state">Loading incident history&hellip;</div></div>
  </div>

  <div id="refresh-note" class="refresh-note"></div>
  <footer id="footer"></footer>

</div>

<script>
const WORKER_URL = "https://client-site-monitor-worker.john-7d8.workers.dev";
const REFRESH_INTERVAL_MS = 90 * 1000;

// History bar: a fixed 24h window bucketed into 30-min segments (48 total),
// so the bar always represents a full day regardless of check frequency,
// with bolder marker ticks + labels at these hours-ago points.
const BAR_WINDOW_HOURS = 24;
const BAR_BUCKET_MINUTES = 30;
const BAR_BUCKET_COUNT = (BAR_WINDOW_HOURS * 60) / BAR_BUCKET_MINUTES;
const BAR_MARKER_HOURS = [24, 18, 12, 6, 0]; // 0 = "now" -- taller tick at each of these
const BAR_LABEL_HOURS = [24, 12, 0]; // subset of BAR_MARKER_HOURS that also gets a text label

const UP_COLOR = "#22c55e";
const DOWN_COLOR = "#ef4444";

// Domain-expiry box: solid green at/above this many days, then a smooth
// gradient toward red as the renewal date approaches (no hard bands, unlike
// the SSL box or the Slack alert thresholds in monitor.py).
const DOMAIN_GRADIENT_FLOOR_DAYS = 30;

// A site whose "Last Checked" is older than this is shown as Stale (grey)
// rather than its last-known status -- usually it's been removed from the
// Monitors tab but its old row is still sitting in the Status tab.
const STALE_AFTER_MINUTES = 60;

// ---------------------------------------------------------------------------
// Theme
// ---------------------------------------------------------------------------
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme-toggle").textContent = theme === "dark" ? "Light mode" : "Dark mode";
  localStorage.setItem("dashboardTheme", theme);
}
(function initTheme() {
  const saved = localStorage.getItem("dashboardTheme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (prefersDark ? "dark" : "light"));
})();
document.getElementById("theme-toggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
});

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
document.getElementById("tab-monitors").addEventListener("click", () => switchTab("monitors"));
document.getElementById("tab-incidents").addEventListener("click", () => switchTab("incidents"));
function switchTab(name) {
  document.getElementById("view-monitors").style.display = name === "monitors" ? "" : "none";
  document.getElementById("view-incidents").style.display = name === "incidents" ? "" : "none";
  document.getElementById("tab-monitors").classList.toggle("active", name === "monitors");
  document.getElementById("tab-incidents").classList.toggle("active", name === "incidents");
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
// Makes Sheet text safe to drop into innerHTML (so a "<" or "&" in a site
// name can't break the page).
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

// Only allow http(s) links from the Sheet.
function safeUrl(url) {
  return /^https?:\/\//i.test(url || "") ? escapeHtml(url) : "#";
}

// A check where the server answered but refused the monitor: either
// monitor.py's SiteGround bot-block (recorded as UP, see SG_BLOCK_DETAIL in
// monitor.py) or an older/other DOWN with HTTP 403.
function isBlockedEntry(e) {
  const detail = (e && e.detail) || "";
  return /SiteGround bot block/.test(detail) || (e.status === "DOWN" && /^HTTP 403\b/.test(detail));
}

// One of "up" | "down" | "blocked" | "stale". "blocked" is shown amber
// rather than red -- the host is up, it's just refusing the monitor.
function siteState(row, entries) {
  const checked = parseTimestamp(row["Last Checked (UTC)"]);
  if (!checked || Date.now() - checked.getTime() > STALE_AFTER_MINUTES * 60000) return "stale";
  const latest = entries[entries.length - 1];
  if (latest && isBlockedEntry(latest)) return "blocked";
  return row["Status"] === "DOWN" ? "down" : "up";
}

// When the current run of blocked checks began (walking back from the latest).
function findBlockedSince(entries) {
  let since = null;
  for (let i = entries.length - 1; i >= 0 && isBlockedEntry(entries[i]); i--) since = entries[i].time;
  return since;
}

function parseTimestamp(str) {
  if (!str) return null;
  // Expected format: "YYYY-MM-DD HH:MM UTC"
  const cleaned = str.replace(" UTC", "Z").replace(" ", "T");
  const d = new Date(cleaned);
  return isNaN(d.getTime()) ? null : d;
}

function timeAgo(date) {
  if (!date) return "—";
  const diffMs = Date.now() - date.getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + " hr" + (hrs === 1 ? "" : "s") + " ago";
  const days = Math.floor(hrs / 24);
  return days + " day" + (days === 1 ? "" : "s") + " ago";
}

function formatDuration(ms) {
  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + "m";
  const hrs = Math.floor(mins / 60);
  const remMins = mins % 60;
  if (hrs < 24) return hrs + "h " + remMins + "m";
  const days = Math.floor(hrs / 24);
  const remHrs = hrs % 24;
  return days + "d " + remHrs + "h";
}

function formatDateTime(date) {
  if (!date) return "—";
  // Display in UK local time (handles BST/GMT switches automatically).
  return date.toLocaleString("en-GB", {
    day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/London"
  });
}

function daysClass(days) {
  if (days === "" || days === undefined || isNaN(parseInt(days))) return "expiry-ok";
  const d = parseInt(days);
  if (d <= 7) return "expiry-critical";
  if (d <= 30) return "expiry-warn";
  return "expiry-ok";
}

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function lerpColor(hexA, hexB, t) {
  t = Math.max(0, Math.min(1, t));
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const rgb = a.map((c, i) => Math.round(c + (b[i] - c) * t));
  return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
}

// Solid green at/above DOMAIN_GRADIENT_FLOOR_DAYS, then a smooth blend
// toward red as days-left shrinks to 0 -- a continuous gradient rather
// than the hard-banded SSL/Slack thresholds.
function domainGradientColor(days) {
  if (isNaN(days)) return null;
  if (days >= DOMAIN_GRADIENT_FLOOR_DAYS) return UP_COLOR;
  if (days <= 0) return DOWN_COLOR;
  const t = 1 - days / DOMAIN_GRADIENT_FLOOR_DAYS;
  return lerpColor(UP_COLOR, DOWN_COLOR, t);
}

// Maps an "hours ago" marker to its bucket index (0 = oldest/leftmost,
// BAR_BUCKET_COUNT-1 = most recent/rightmost) for label + marker-tick placement.
function markerBucketIndex(hoursAgo) {
  const idx = BAR_BUCKET_COUNT - Math.round((hoursAgo * 60) / BAR_BUCKET_MINUTES);
  return Math.max(0, Math.min(BAR_BUCKET_COUNT - 1, idx));
}

// Finds when a currently-down site went down: prefers the open Incidents
// row (what monitor.py itself uses to track outages), falling back to
// walking back through this site's own History if no incident row exists
// yet (e.g. right at the moment it just flipped to DOWN).
function findDownSince(name, entries, incidents) {
  const ongoing = incidents.find(i => i.name === name && !i.end);
  if (ongoing) return ongoing.start;
  for (let i = entries.length - 1; i >= 0; i--) {
    if (entries[i].status !== "DOWN") {
      return i + 1 < entries.length ? entries[i + 1].time : null;
    }
  }
  return entries.length ? entries[0].time : null;
}

// ---------------------------------------------------------------------------
// History processing
// ---------------------------------------------------------------------------
function groupHistoryByName(history) {
  const bySite = {};
  history.forEach(h => {
    const name = h["Name"];
    if (!name) return;
    const t = parseTimestamp(h["Timestamp (UTC)"]);
    if (!t) return;
    if (!bySite[name]) bySite[name] = [];
    bySite[name].push({ time: t, status: h["Status"], detail: h["Detail"] });
  });
  Object.values(bySite).forEach(entries => entries.sort((a, b) => a.time - b.time));
  return bySite;
}

// Parses the Incidents tab rows (written by monitor.py on each outage)
// into {name, start, end} objects, newest first.
function parseIncidents(incidentRows) {
  const incidents = [];
  (incidentRows || []).forEach(r => {
    const start = parseTimestamp(r["Start (UTC)"]);
    if (!r["Name"] || !start) return;
    incidents.push({
      name: r["Name"],
      start,
      end: parseTimestamp(r["End (UTC)"]) || null,
    });
  });
  incidents.sort((a, b) => b.start - a.start);
  return incidents;
}

function uptimePercent(entries) {
  if (!entries.length) return null;
  const upCount = entries.filter(e => e.status === "UP").length;
  return (upCount / entries.length) * 100;
}

// Buckets a site's history into BAR_BUCKET_COUNT fixed 30-min windows
// spanning the last 24h (regardless of how many real checks happened),
// so the bar always shows a full day. Each bucket tracks total checks and
// how many failed, so bucketColor() can grade the color by how bad that
// window was rather than one bad check painting the whole segment red.
function bucketHistory(entries) {
  const buckets = new Array(BAR_BUCKET_COUNT).fill(null);
  const nowMs = Date.now();
  const windowMs = BAR_WINDOW_HOURS * 60 * 60 * 1000;
  const bucketMs = BAR_BUCKET_MINUTES * 60 * 1000;
  entries.forEach(e => {
    const age = nowMs - e.time.getTime();
    if (age < 0 || age >= windowMs) return;
    const idx = BAR_BUCKET_COUNT - 1 - Math.floor(age / bucketMs);
    if (idx < 0 || idx >= BAR_BUCKET_COUNT) return;
    if (!buckets[idx]) buckets[idx] = { total: 0, down: 0 };
    buckets[idx].total++;
    if (e.status === "DOWN") buckets[idx].down++;
  });
  return buckets;
}

// Graduated color per bucket (Statuspage-style): 0 failed checks in the
// window = solid green, all failed = solid red, anything in between blends
// toward red -- and even a single failed check nudges noticeably off pure
// green so a small blip isn't invisible, without looking as severe as a
// full outage the way a flat "any failure = red" would.
function bucketColor(bucket) {
  if (!bucket || !bucket.total) return null;
  const failFraction = bucket.down / bucket.total;
  if (failFraction === 0) return UP_COLOR;
  const t = 0.35 + failFraction * 0.65;
  return lerpColor(UP_COLOR, DOWN_COLOR, t);
}

function renderMiniBar(entries) {
  const buckets = bucketHistory(entries);
  const markerIndexes = new Set(BAR_MARKER_HOURS.map(markerBucketIndex));

  const ticks = buckets.map((b, i) => {
    const color = bucketColor(b);
    const style = color ? ` style="background:${color}"` : "";
    const marker = markerIndexes.has(i) ? " marker" : "";
    const title = b ? `${b.total} check${b.total === 1 ? "" : "s"}, ${b.down} down` : "no data";
    return `<span class="tick${marker}"${style} title="${title}"></span>`;
  }).join("");

  const lastIdx = BAR_BUCKET_COUNT - 1;
  const labels = buckets.map((_, i) => {
    const hourLabel = BAR_LABEL_HOURS.find(h => markerBucketIndex(h) === i);
    if (hourLabel === undefined) return "<span></span>";
    const align = i === 0 ? "left" : i === lastIdx ? "right" : "center";
    const text = hourLabel === 0 ? "now" : hourLabel + "h";
    return `<span style="text-align:${align}">${text}</span>`;
  }).join("");

  return `<div class="bar-inner"><div class="mini-bar">${ticks}</div><div class="bar-labels">${labels}</div></div>`;
}

// ---------------------------------------------------------------------------
// Rendering: Monitors tab
// ---------------------------------------------------------------------------
function render(rows, bySite, incidents) {
  const loading = document.getElementById("loading");
  if (loading) loading.remove();

  const sites = rows.map(r => {
    const entries = bySite[r["Name"]] || [];
    return { r, entries, state: siteState(r, entries) };
  });
  const countOf = state => sites.filter(s => s.state === state).length;
  const downCount = countOf("down");
  const blockedCount = countOf("blocked");
  const staleCount = countOf("stale");
  // Stale rows' SSL/domain figures are out of date, so leave them out of
  // the expiry count + panel.
  const liveRows = sites.filter(s => s.state !== "stale").map(s => s.r);
  const expiringCount = liveRows.filter(r => {
    const s = parseInt(r["SSL Days Left"]);
    const d = parseInt(r["Domain Days Left"]);
    return (!isNaN(s) && s <= 30) || (!isNaN(d) && d <= 30);
  }).length;

  document.getElementById("countbar").innerHTML = `
    <div class="count-item"><span class="count-dot up"></span><b>${countOf("up")}</b> up</div>
    <div class="count-item"><span class="count-dot down"></span><b>${downCount}</b> down</div>
    ${blockedCount ? `<div class="count-item"><span class="count-dot warn"></span><b>${blockedCount}</b> blocked</div>` : ""}
    ${staleCount ? `<div class="count-item"><span class="count-dot stale"></span><b>${staleCount}</b> stale</div>` : ""}
    <div class="count-item"><span class="count-dot warn"></span><b>${expiringCount}</b> expiring &le; 30d</div>
    <div class="count-item"><b>${rows.length - staleCount}</b> total monitored</div>
  `;

  renderSummary24h(bySite, incidents, downCount > 0);
  renderExpiringPanel(liveRows);

  const STATE_ORDER = { down: 0, blocked: 1, up: 2, stale: 3 };
  const STATE_LABEL = { up: "Up", down: "Down", blocked: "Blocked", stale: "Stale" };
  const STATE_ICON = { up: "&#9650;", down: "&#9679;", blocked: "&#9679;", stale: "&#8211;" };

  const sorted = [...sites].sort((a, b) => {
    if (a.state !== b.state) return STATE_ORDER[a.state] - STATE_ORDER[b.state];
    return (a.r["Name"] || "").localeCompare(b.r["Name"] || "");
  });

  const rowsHtml = sorted.map(({ r, entries, state }) => {
    const isDown = state === "down" || state === "blocked";
    const sslDays = parseInt(r["SSL Days Left"]);
    const domDays = parseInt(r["Domain Days Left"]);

    const barHtml = entries.length ? renderMiniBar(entries) : "";

    const latest = entries[entries.length - 1];
    let detailHtml = "";
    if (state === "stale") {
      detailHtml = `<div class="status-detail">No longer being checked</div>`;
    } else if (isDown && latest && latest.detail) {
      const hint = state === "blocked" ? "Server is up but refusing the monitor (e.g. host bot protection)" : "";
      detailHtml = `<div class="status-detail" title="${hint}">${escapeHtml(latest.detail)}</div>`;
    }

    const uptimeBox = isDown
      ? (() => {
          const since = state === "blocked" ? findBlockedSince(entries) : findDownSince(r["Name"], entries, incidents);
          const elapsed = since ? formatDuration(Date.now() - since.getTime()) : "—";
          const title = since ? `Since ${formatDateTime(since)}` : "";
          const color = state === "blocked" ? "var(--warn-text)" : "var(--down-text)";
          return `<div class="stat-box" title="${title}">
            <div class="stat-num" style="color:${color}">${elapsed}</div>
            <div class="stat-label">${state === "blocked" ? "Blocked for" : "Down for"}</div>
          </div>`;
        })()
      : (() => {
          const pct = uptimePercent(entries);
          return `<div class="stat-box">
            <div class="stat-num">${pct === null ? "—" : pct.toFixed(2) + "%"}</div>
            <div class="stat-label">Uptime</div>
          </div>`;
        })();

    const sslBox = isNaN(sslDays) ? "" : `<div class="stat-box">
        <div class="stat-num ${daysClass(sslDays)}">${sslDays}d</div>
        <div class="stat-label">SSL</div>
      </div>`;

    const domainColor = domainGradientColor(domDays);
    const domainBox = isNaN(domDays) ? "" : `<div class="stat-box">
        <div class="stat-num" style="color:${domainColor}">${domDays}d</div>
        <div class="stat-label">Domain</div>
      </div>`;

    return `
      <div class="row">
        <div class="row-left">
          <div class="status-icon ${state}">${STATE_ICON[state]}</div>
          <div class="row-main">
            <a class="row-name" href="${safeUrl(r['URL'])}" target="_blank" rel="noopener">${escapeHtml(r["Name"])}</a>
            <div class="row-meta">
              <span class="type-tag">HTTP</span>
              <span class="checked-ago">checked ${timeAgo(parseTimestamp(r["Last Checked (UTC)"]))}</span>
            </div>
          </div>
        </div>
        <div class="row-bar">${barHtml}</div>
        <div class="row-right">
          <div class="status-label ${state}">${STATE_LABEL[state]}</div>
          ${detailHtml}
          <div class="stat-boxes">${uptimeBox}${sslBox}${domainBox}</div>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("content").innerHTML = `<div class="list">${rowsHtml}</div>`;

  document.getElementById("footer").textContent =
    "Auto-refreshes every " + (REFRESH_INTERVAL_MS / 1000) + "s. Underlying checks run every 5 minutes.";
}

function renderExpiringPanel(rows) {
  const items = [];
  rows.forEach(r => {
    const sslDays = parseInt(r["SSL Days Left"]);
    const domDays = parseInt(r["Domain Days Left"]);
    if (!isNaN(sslDays) && sslDays <= 30) {
      items.push({ name: r["Name"], label: "SSL", days: sslDays, date: r["SSL Expiry Date"] });
    }
    if (!isNaN(domDays) && domDays <= 30) {
      items.push({ name: r["Name"], label: "Domain", days: domDays, date: r["Domain Expiry Date"] });
    }
  });

  const panel = document.getElementById("expiring-panel");
  if (!items.length) {
    panel.innerHTML = "";
    panel.className = "";
    return;
  }

  items.sort((a, b) => a.days - b.days);

  const rowsHtml = items.map(i => {
    const cls = i.days <= 7 ? "expiry-critical" : "expiry-warn";
    return `
      <div class="expiring-item">
        <div><span class="name">${escapeHtml(i.name)}</span> <span class="detail">${i.label} &middot; ${escapeHtml(i.date)}</span></div>
        <div class="days ${cls}">${i.days}d</div>
      </div>
    `;
  }).join("");

  panel.className = "expiring-panel";
  panel.innerHTML = `<div class="panel-title">Expiring soon</div>${rowsHtml}`;
}

function renderSummary24h(bySite, allIncidents, anyDownNow) {
  const cutoff = Date.now() - 24 * 60 * 60 * 1000;
  let upCount = 0, totalCount = 0;
  const incidents24h = allIncidents.filter(i => i.start.getTime() >= cutoff);

  Object.values(bySite).forEach(entries => {
    entries.forEach(e => {
      if (e.time.getTime() >= cutoff) {
        totalCount++;
        if (e.status === "UP") upCount++;
      }
    });
  });

  const uptimePct = totalCount ? (upCount / totalCount * 100) : null;

  // Time since the most recently resolved incident (across all sites).
  const resolved = allIncidents.filter(i => i.end).sort((a, b) => b.end - a.end);
  let sinceLabel = "No data yet";
  if (anyDownNow) {
    sinceLabel = "Ongoing";
  } else if (resolved.length) {
    sinceLabel = formatDuration(Date.now() - resolved[0].end.getTime());
  } else if (totalCount) {
    sinceLabel = "No incidents";
  }

  document.getElementById("summary24h").innerHTML = `
    <div class="summary-card ${uptimePct !== null && uptimePct < 100 ? 'bad' : 'good'}">
      <div class="num">${uptimePct === null ? '—' : uptimePct.toFixed(2) + '%'}</div>
      <div class="label">Uptime (24h)</div>
    </div>
    <div class="summary-card ${incidents24h.length ? 'bad' : 'good'}">
      <div class="num">${incidents24h.length}</div>
      <div class="label">Incidents (24h)</div>
    </div>
    <div class="summary-card ${anyDownNow ? 'bad' : 'good'}">
      <div class="num">${sinceLabel}</div>
      <div class="label">${anyDownNow ? 'Currently down' : 'Since last incident'}</div>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Rendering: Incidents tab
// ---------------------------------------------------------------------------
function renderIncidents(incidents) {
  if (!incidents.length) {
    document.getElementById("incidents-content").innerHTML =
      `<div class="state">No incidents recorded in the last 60 days.</div>`;
    return;
  }

  const html = incidents.map(i => {
    const ongoing = !i.end;
    const duration = ongoing ? Date.now() - i.start.getTime() : i.end - i.start;
    const timeLabel = ongoing
      ? `Started ${formatDateTime(i.start)} &mdash; still down`
      : `${formatDateTime(i.start)} &rarr; ${formatDateTime(i.end)}`;
    return `
      <div class="incident-row">
        <div class="incident-icon ${ongoing ? 'ongoing' : 'resolved'}">${ongoing ? '!' : '&#10003;'}</div>
        <div class="incident-main">
          <div class="incident-name">${escapeHtml(i.name)}</div>
          <div class="incident-time">${timeLabel} &middot; ${formatDuration(duration)}</div>
        </div>
        <div class="incident-badge ${ongoing ? 'ongoing' : 'resolved'}">${ongoing ? 'Ongoing' : 'Resolved'}</div>
      </div>
    `;
  }).join("");

  document.getElementById("incidents-content").innerHTML = `<div class="list">${html}</div>`;
}

// ---------------------------------------------------------------------------
// Fetch + error handling
// ---------------------------------------------------------------------------
// Time of the last successful load. Once we have good data on screen, a
// failed refresh just shows a small note instead of wiping the list.
let lastGoodLoad = null;

function renderError(message) {
  if (lastGoodLoad) {
    document.getElementById("refresh-note").textContent =
      `Couldn't refresh (${message}) -- showing data from ${formatDateTime(lastGoodLoad)}.`;
    return;
  }
  const html = `<div class="state error">Couldn't load status data.<br>${escapeHtml(message)}</div>`;
  document.getElementById("content").innerHTML = html;
  document.getElementById("incidents-content").innerHTML = html;
}

async function load() {
  try {
    const res = await fetch(WORKER_URL);
    if (!res.ok) { renderError("HTTP " + res.status); return; }
    const data = await res.json();
    if (data.error) { renderError(data.error); return; }
    if (!data.rows || data.rows.length === 0) { renderError("No rows returned."); return; }
    const bySite = groupHistoryByName(data.history || []);
    const incidents = parseIncidents(data.incidents || []);
    render(data.rows, bySite, incidents);
    renderIncidents(incidents);
    lastGoodLoad = new Date();
    document.getElementById("refresh-note").textContent = "";
  } catch (e) {
    renderError(e.message || String(e));
  }
}

load();
setInterval(load, REFRESH_INTERVAL_MS);
</script>
