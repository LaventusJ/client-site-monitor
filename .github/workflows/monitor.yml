name: Site Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check mode: uptime or full'
        required: false
        default: 'full'
  # No native `schedule:` trigger here -- GitHub's own cron scheduler proved
  # unreliable for this (confirmed: zero automatic fires over 40+ minutes on
  # a */5 schedule). An external cron service (cron-job.org) calls the
  # workflow_dispatch API endpoint every 5 minutes instead, passing `mode`
  # directly. Don't re-add `schedule:` without removing the external cron
  # job first, or both will fire and double-write every check.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Work out which mode to run in
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=uptime" >> "$GITHUB_OUTPUT"
          fi

      - name: Run monitor
        env:
          CHECK_MODE: ${{ steps.mode.outputs.mode }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          ZAPIER_WEBHOOK_DOWNTIME: ${{ secrets.ZAPIER_WEBHOOK_DOWNTIME }}
          ZAPIER_WEBHOOK_EXPIRY: ${{ secrets.ZAPIER_WEBHOOK_EXPIRY }}
        run: python monitor.py
